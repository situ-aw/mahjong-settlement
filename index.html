<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麻雀精算ツール</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;padding:10px}
h1{text-align:center;font-size:22px;margin:4px 0 10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.tabs button{padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff;font-weight:700;font-size:16px}.tabs .active{background:#333;color:#fff}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;margin-bottom:9px;overflow:hidden}.title{font-weight:700;background:#eee;padding:7px 10px;font-size:14px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ddd}.setting{background:#fff;padding:7px 9px;display:flex;justify-content:space-between;font-size:13px}.setting b{font-size:13px}
.inputs{padding:9px}.inputrow{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:8px;margin:6px 0}.inputrow label{font-weight:700}.inputrow input{width:100%;padding:9px;border:1px solid #aaa;border-radius:7px;text-align:right;font-size:18px}.auto{background:#f0f0f0;color:#555}
.result{padding:0 9px 8px}.resrow{display:grid;grid-template-columns:42px 1fr 92px;gap:5px;padding:7px 2px;border-bottom:1px solid #eee;font-size:14px}.calc{font-weight:600}.resrow:last-child{border:0}.rank{font-weight:700}.pt{text-align:right;font-weight:800;font-size:16px}.positive{color:#087443}.negative{color:#b42318}.zero{color:#444}
.note{text-align:center;color:#777;font-size:11px;margin:5px 0}
button.reset{width:100%;padding:9px;border:0;border-radius:7px;background:#ddd;font-weight:700}
</style>
</head>
<body>
<main class="app">
<h1>麻雀精算ツール</h1>
<div class="tabs"><button id="y" class="active">四麻</button><button id="s">三麻</button></div>

<section class="card">
<div class="title">設定</div>
<div class="settings">
<div class="setting"><span>初期点</span><b>35,000点持ち</b></div>
<div class="setting"><span>オカ</span><b>40,000点返し</b></div>
<div class="setting"><span>ウマ</span><b id="uma">10-20</b></div>
<div class="setting"><span>レート</span><b>50（テンゴ）</b></div>
</div>
</section>

<section class="card">
<div class="title">点数入力</div>
<div class="inputs" id="inputs"></div>
</section>

<section class="card">
<div class="title">精算結果</div>
<div class="result" id="result"></div>
</section>
<div class="note">下位の点数を入力すると、1位を自動計算します。</div>
<button class="reset" id="reset">リセット</button>
</main>
<script>
let mode="yonma";
const total=()=>mode==="yonma"?140000:105000;
const uma=()=>mode==="yonma"?[20,10,-10,-20]:[20,0,-20];
const names=["1位","2位","3位","4位"];

function setup(){
 document.getElementById("uma").textContent=mode==="yonma"?"10-20":"順位20";
 const n=mode==="yonma"?4:3, box=document.getElementById("inputs");
 box.innerHTML="";
 for(let i=0;i<n;i++){
   const row=document.createElement("div");row.className="inputrow";
   row.innerHTML=`<label>${names[i]}${i===0?'（自動計算）':''}</label><input ${i===0?'class="auto readonly" readonly':''} inputmode="decimal" type="number" step="100" placeholder="${i===0?'AUTO':'例: '+(i===1?'40000':'25000')}">`;
   box.appendChild(row);
 }
 box.querySelectorAll("input").forEach((el,i)=>{if(i>0)el.addEventListener("input",calc)});
 document.getElementById("result").innerHTML="";
}
function calc(){
 const ins=[...document.querySelectorAll("#inputs input")];
 // 「0」やマイナスの点数も有効。空欄だけを未入力として扱う。
 const knownInputs=ins.slice(1);
 if(knownInputs.some(x=>x.value.trim()==="")){
   ins[0].value="";
   document.getElementById("result").innerHTML="";
   return;
 }
 const known=knownInputs.map(x=>Number(x.value));
 if(known.some(v=>!Number.isFinite(v))){
   ins[0].value="";
   document.getElementById("result").innerHTML="";
   return;
 }
 const first=total()-known.reduce((a,b)=>a+b,0);
 ins[0].value=first;
 const vals=[first,...known];
 const u=uma();
 // オカ = (点返し - 初期点) × 人数。オカは1位に加算する。
 const oka=(40000-(mode==="yonma"?35000:35000))*(mode==="yonma"?4:3)/1000;
 const rate=50;
 let out=vals.map((score,i)=>({
   rank:i+1,
   score,
   uma:u[i],
   oka:i===0?oka:0,
   point:(score-40000)/1000+u[i]+(i===0?oka:0)
 }));
 document.getElementById("result").innerHTML=out.map(r=>{
   const cls=r.point>0?"positive":r.point<0?"negative":"zero";
   const money = Math.round((r.point * rate) / 10) * 10;
   return `<div class="resrow"><div class="rank">${r.rank}位</div><div class="calc">${money.toLocaleString()}円</div></div>`;
 }).join("");
}
document.getElementById("y").onclick=()=>{mode="yonma";document.getElementById("y").classList.add("active");document.getElementById("s").classList.remove("active");setup()};
document.getElementById("s").onclick=()=>{mode="sanma";document.getElementById("s").classList.add("active");document.getElementById("y").classList.remove("active");setup()};
document.getElementById("reset").onclick=setup;
setup();
</script>
</body>
</html>
